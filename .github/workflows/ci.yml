name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Bridge, MCP protocol, end-to-end with a fake plugin, Luau compile,
      # clicker math. No Studio needed on CI.
      - run: npm ci
      - run: npm test

      # The committed .rbxmx must match plugin/src.
      - run: npm run build:plugin
      - run: git diff --exit-code -- plugin/RobloxMCP.rbxmx
